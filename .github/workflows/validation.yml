name: Validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

  internal-links:
    name: Internal link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check relative markdown links resolve
        run: python3 .github/scripts/check_internal_links.py

  json-validate:
    name: Validate JSON files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON syntax
        run: python3 .github/scripts/validate_json.py

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML files
        run: yamllint -c .yamllint.yml .github/workflows

  incident-evidence:
    name: Incident evidence and regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate bundled incident evidence
        run: python3 automation/validate_incidents.py
      - name: Run synthetic failure demo
        run: python3 automation/demo.py
